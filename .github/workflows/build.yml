name: build

on:
  workflow_dispatch:
    inputs:
      pins:
        description: "fork = Lean v4.34.0 + Mathlib 5ed2965; bos = Lean v4.34.1 + Mathlib d13f23b"
        type: choice
        options: [fork, bos]
        default: fork
      chd:
        description: "Also build the C-HD proof (Frontier.CHD.Final) and print its axioms"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl --fail --location --output /tmp/elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Use the verifier pins
        if: inputs.pins == 'bos'
        run: |
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          sed -i 's/5ed2965256430c3649e86755f9576b54eca72435/d13f23b723b8a846827a245b89c10fc7d3f11612/' lakefile.toml
          grep -q "d13f23b723b8a846827a245b89c10fc7d3f11612" lakefile.toml

      - name: Resolve dependencies
        run: |
          cat lean-toolchain
          lake update
          cat lake-manifest.json

      - name: Get the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Print axioms
        run: lake env lean Axioms.lean

      - name: Build the C-HD proof
        if: inputs.chd
        run: lake build Frontier.CHD.Final

      - name: Print the C-HD axioms
        if: inputs.chd
        run: lake env lean AxiomsCHD.lean
