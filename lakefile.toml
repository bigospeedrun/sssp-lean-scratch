name = "bossssp"
version = "0.1.0"
defaultTargets = ["Submission"]
# The workflow builds Submission.Validation first; only its chd input builds the library (the C-HD proof).

# Pins of the fork (formal/lean at 98c53acc): Lean v4.34.0, Mathlib 5ed2965.
# The "bos" input of the build workflow changes both to the verifier pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[require]]
name = "frontierformal"
git = "https://github.com/bigospeedrun/c-hd-proof.git"
rev = "98c53accb47a505482a1781597ae14bf67e81cec"
subDir = "formal/lean"

[[lean_lib]]
name = "Submission"
